<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>winnow fixture — profile</title>
    <style>
      :root {
        color-scheme: light dark;
        --footer-height: 64px;
      }
      body {
        margin: 0;
        font: 16px/1.5 system-ui, sans-serif;
        min-height: 100vh;
      }
      main {
        max-width: 32rem;
        margin: 0 auto;
        padding: 2rem 1rem;
        /* Keeps the last control clear of the fixed footer.
           Removing this is one of the planted defects — see README. */
        padding-bottom: calc(var(--footer-height) + 2rem);
      }
      label {
        display: block;
        margin: 1rem 0 0.25rem;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 0.5rem;
        font: inherit;
        box-sizing: border-box;
      }
      button {
        margin-top: 1.5rem;
        padding: 0.6rem 1.2rem;
        font: inherit;
        cursor: pointer;
      }
      footer {
        position: fixed;
        inset-inline: 0;
        bottom: 0;
        height: var(--footer-height);
        display: flex;
        align-items: center;
        justify-content: center;
        background: #222;
        color: #fff;
      }
      #result {
        margin-top: 1rem;
        font-family: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Profile</h1>
      <form id="profile-form">
        <label for="name">Name</label>
        <input id="name" name="name" autocomplete="given-name" />

        <label for="surname">Surname</label>
        <input id="surname" name="surname" autocomplete="family-name" />

        <button id="save" type="submit">Save profile</button>
      </form>
      <p id="result" role="status"></p>
    </main>

    <footer>a fixed footer, on purpose</footer>

    <script type="module">
      const form = document.querySelector("#profile-form");
      const result = document.querySelector("#result");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const data = new FormData(form);
        const response = await fetch("/api/profile", {
          method: "PATCH",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            name: data.get("name"),
            surname: data.get("surname"),
          }),
        });
        if (!response.ok) {
          result.textContent = `error ${response.status}`;
          return;
        }
        const body = await response.json();
        result.textContent = `saved: ${body.display}`;
      });
    </script>
  </body>
</html>
