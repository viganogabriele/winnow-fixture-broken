<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>winnow fixture — profile</title>
    <style>
      :root {
        color-scheme: light dark;
        --footer-height: 64px;
      }
      body {
        margin: 0;
        font: 16px/1.5 system-ui, sans-serif;
      }
      main {
        max-width: 32rem;
        margin: 0 auto;
        padding: 2rem 1rem;
        /* The form is longer than a phone screen, so the last control ends up
           at the bottom of the document — right where the fixed footer sits.
           This keeps it clear. Removing it is planted defect 3; see README. */
        padding-bottom: calc(var(--footer-height) + 2rem);
      }
      p.intro {
        color: color-mix(in srgb, currentColor 70%, transparent);
      }
      label {
        display: block;
        margin: 1rem 0 0.25rem;
        font-weight: 600;
      }
      input,
      textarea {
        width: 100%;
        padding: 0.5rem;
        font: inherit;
        box-sizing: border-box;
      }
      fieldset {
        margin-top: 1.5rem;
      }
      fieldset label {
        font-weight: 400;
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      fieldset input {
        width: auto;
      }
      button {
        margin-top: 1.5rem;
        padding: 0.6rem 1.2rem;
        font: inherit;
        cursor: pointer;
      }
      footer {
        position: fixed;
        inset-inline: 0;
        bottom: 0;
        height: var(--footer-height);
        display: flex;
        align-items: center;
        justify-content: center;
        background: #222;
        color: #fff;
      }
      #result {
        margin-top: 1rem;
        font-family: ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Profile</h1>
      <p class="intro">
        Everything here is optional except your name. The form is deliberately
        longer than a phone screen, because the interesting layout bugs only
        happen once a page scrolls and something is pinned to the viewport.
      </p>

      <form id="profile-form">
        <label for="name">Name</label>
        <input id="name" name="name" autocomplete="given-name" />

        <label for="surname">Surname</label>
        <input id="surname" name="surname" autocomplete="family-name" />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" />

        <label for="city">City</label>
        <input id="city" name="city" autocomplete="address-level2" />

        <label for="website">Website</label>
        <input id="website" name="website" type="url" />

        <label for="bio">Bio</label>
        <textarea id="bio" name="bio" rows="6"></textarea>

        <fieldset>
          <legend>Notifications</legend>
          <label><input type="checkbox" name="notify-mentions" /> Mentions</label>
          <label><input type="checkbox" name="notify-replies" /> Replies</label>
          <label><input type="checkbox" name="notify-digest" /> Weekly digest</label>
        </fieldset>

        <button id="save" type="submit">Save profile</button>
      </form>
      <p id="result" role="status"></p>
    </main>

    <footer>a fixed footer, on purpose</footer>

    <script type="module">
      const form = document.querySelector("#profile-form");
      const result = document.querySelector("#result");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const data = new FormData(form);

        // Optional fields that are blank are left out of the payload rather
        // than sent as empty strings — which is what most clients do, and what
        // makes an unchecked default on the server observable from the browser.
        const payload = { name: data.get("name") };
        const surname = data.get("surname");
        if (surname) payload.surname = surname;

        const response = await fetch("/api/profile", {
          method: "PATCH",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!response.ok) {
          result.textContent = `error ${response.status}`;
          return;
        }
        const body = await response.json();
        result.textContent = `saved: ${body.display}`;
      });
    </script>
  </body>
</html>
